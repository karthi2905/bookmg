server:
  port: 8083

spring:
  application:
    name: booking-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Feign Client configuration
resource-service:
  url: ${RESOURCE_SERVICE_URL:http://localhost:8082}

# Business Rules
booking:
  max-duration-hours: 8
  checkin-window-before-minutes: 10
  auto-release-after-minutes: 15
  working-hours:
    start: 9
    end: 18

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

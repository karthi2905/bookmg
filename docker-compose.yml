services:
  postgres:
    image: postgres:16-alpine
    container_name: bookmg-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: bookmg-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  resource-service:
    build:
      context: ./resource-service
    container_name: bookmg-resource-service
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: resource_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    build:
      context: ./booking-service
    container_name: bookmg-booking-service
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: booking_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      RESOURCE_SERVICE_URL: http://resource-service:8082
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      resource-service:
        condition: service_started

  api-gateway:
    build:
      context: ./api-gateway
    container_name: bookmg-api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      RESOURCE_SERVICE_URL: http://resource-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - resource-service
      - booking-service

  frontend:
    build:
      context: ./frontend
    container_name: bookmg-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
